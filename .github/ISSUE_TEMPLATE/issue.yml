name: ✨ Issue Template ✨
description: 이슈 템플릿
body:
  - type: textarea
    attributes:
      label: ✅ 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
    validations:
      required: true
    value: |
      ### 💡 작업 내용
      -
      -
      
      ### 🔍 변경 이유
      -
      -
      
      
      ### ✅ 변경 유형
      - [ ] feat (새로운 기능)
      - [ ] fix (버그 수정)
      - [ ] refactor (코드 구조 개선)
      - [ ] chore (설정, 빌드 관련 등)
      - [ ] docs (문서 수정)
      - [ ] test (테스트 코드 추가/수정)
    
    
      ### 🧠 기타 참고 사항
        (관련 이슈 번호, 참고 문서, 스크린샷 등)
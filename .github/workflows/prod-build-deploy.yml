name: CI-CD(Build, Deploy to Production)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t baedalsodae:latest \
            --load .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          docker save baedalsodae:latest | gzip > baedalsodae.tar.gz

      - name: Build mock-pg image
        run: |
          docker build -t mock-pg:latest ./mock-pg
          docker save mock-pg:latest | gzip > mock-pg.tar.gz

      - name: Upload images to HAProxy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HAPROXY_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "baedalsodae.tar.gz,mock-pg.tar.gz"
          target: "/home/ec2-user/baedalsodae"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to API-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HAPROXY_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          envs: API_SERVER_PORT,ENCRYPTION_AES_KEY,JWT_SECRET,JWT_EXPIRATION,JWT_REFRESH_EXPIRATION,POSTGRES_DB,POSTGRES_DB_URL,POSTGRES_PASSWORD,POSTGRES_PORT,POSTGRES_USER,POSTGRES_DEFAULT_SCHEMA,SPRING_DATA_REDIS_URL,SPRING_DATA_REDIS_HOST,SPRING_DATA_REDIS_PORT,SPRING_DATA_REDIS_PASSWORD
          script: |
            echo "=== SCP images to API-1 ==="
            ssh -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no ec2-user@10.0.1.187 "mkdir -p ~/baedalsodae"
            scp -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no \
              ~/baedalsodae/baedalsodae.tar.gz ~/baedalsodae/mock-pg.tar.gz ec2-user@10.0.1.187:~/baedalsodae/

            echo "=== Deploy to API-1 ==="
            ssh -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no ec2-user@10.0.1.187 \
              "cd ~/baedalsodae && \
              docker load < mock-pg.tar.gz && \
              docker stop baedalsodae-mock-pg 2>/dev/null || true && \
              docker rm baedalsodae-mock-pg 2>/dev/null || true && \
              docker run -d --name baedalsodae-mock-pg -p 8089:8080 mock-pg:latest && \
              docker load < baedalsodae.tar.gz && \
              docker stop baedalsodae-app 2>/dev/null || true && \
              docker rm baedalsodae-app 2>/dev/null || true && \
              docker run -d \
                --name baedalsodae-app \
                -p 8080:8080 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e API_SERVER_PORT=$API_SERVER_PORT \
                -e ENCRYPTION_AES_KEY=$ENCRYPTION_AES_KEY \
                -e JWT_SECRET=$JWT_SECRET \
                -e JWT_EXPIRATION=$JWT_EXPIRATION \
                -e JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION \
                -e POSTGRES_DB=$POSTGRES_DB \
                -e POSTGRES_DB_URL=$POSTGRES_DB_URL \
                -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
                -e POSTGRES_PORT=$POSTGRES_PORT \
                -e POSTGRES_USER=$POSTGRES_USER \
                -e POSTGRES_DEFAULT_SCHEMA=$POSTGRES_DEFAULT_SCHEMA \
                -e SPRING_DATA_REDIS_URL=$SPRING_DATA_REDIS_URL \
                -e SPRING_DATA_REDIS_HOST=$SPRING_DATA_REDIS_HOST \
                -e SPRING_DATA_REDIS_PORT=$SPRING_DATA_REDIS_PORT \
                -e SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD \
                baedalsodae:latest && \
              rm -f baedalsodae.tar.gz mock-pg.tar.gz && \
              docker image prune -f && \
              docker ps"
        env:
          API_SERVER_PORT: ${{ secrets.API_SERVER_PORT }}
          ENCRYPTION_AES_KEY: ${{ secrets.ENCRYPTION_AES_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DEFAULT_SCHEMA: ${{ secrets.POSTGRES_DEFAULT_SCHEMA }}
          SPRING_DATA_REDIS_URL: ${{ secrets.SPRING_DATA_REDIS_URL }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}

      - name: Health Check API-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HAPROXY_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "=== Waiting for API-1 to be healthy ==="
            for i in {1..12}; do
              STATUS=$(ssh -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no ec2-user@10.0.1.187 \
                "curl -s http://localhost:8080/api/v1/actuator/health | grep -m1 -o '\"status\":\"UP\"'" || true)
              if [ "$STATUS" = '"status":"UP"' ]; then
                echo "API-1 is UP! Proceeding to API-2 deploy."
                exit 0
              fi
              echo "Attempt $i/12 - not ready yet, waiting 10s..."
              sleep 10
            done
            echo "API-1 health check failed after 2 minutes!"
            exit 1

      - name: Deploy to API-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HAPROXY_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          envs: API_SERVER_PORT,ENCRYPTION_AES_KEY,JWT_SECRET,JWT_EXPIRATION,JWT_REFRESH_EXPIRATION,POSTGRES_DB,POSTGRES_DB_URL,POSTGRES_PASSWORD,POSTGRES_PORT,POSTGRES_USER,POSTGRES_DEFAULT_SCHEMA,SPRING_DATA_REDIS_URL,SPRING_DATA_REDIS_HOST,SPRING_DATA_REDIS_PORT,SPRING_DATA_REDIS_PASSWORD
          script: |
            echo "=== SCP images to API-2 ==="
            ssh -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no ec2-user@10.0.1.179 "mkdir -p ~/baedalsodae"
            scp -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no \
              ~/baedalsodae/baedalsodae.tar.gz ~/baedalsodae/mock-pg.tar.gz ec2-user@10.0.1.179:~/baedalsodae/

            echo "=== Deploy to API-2 ==="
            ssh -i ~/.ssh/baedalsodae-keypair.pem -o StrictHostKeyChecking=no ec2-user@10.0.1.179 \
              "cd ~/baedalsodae && \
              docker load < mock-pg.tar.gz && \
              docker stop baedalsodae-mock-pg 2>/dev/null || true && \
              docker rm baedalsodae-mock-pg 2>/dev/null || true && \
              docker run -d --name baedalsodae-mock-pg -p 8089:8080 mock-pg:latest && \
              docker load < baedalsodae.tar.gz && \
              docker stop baedalsodae-app 2>/dev/null || true && \
              docker rm baedalsodae-app 2>/dev/null || true && \
              docker run -d \
                --name baedalsodae-app \
                -p 8080:8080 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e API_SERVER_PORT=$API_SERVER_PORT \
                -e ENCRYPTION_AES_KEY=$ENCRYPTION_AES_KEY \
                -e JWT_SECRET=$JWT_SECRET \
                -e JWT_EXPIRATION=$JWT_EXPIRATION \
                -e JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION \
                -e POSTGRES_DB=$POSTGRES_DB \
                -e POSTGRES_DB_URL=$POSTGRES_DB_URL \
                -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
                -e POSTGRES_PORT=$POSTGRES_PORT \
                -e POSTGRES_USER=$POSTGRES_USER \
                -e POSTGRES_DEFAULT_SCHEMA=$POSTGRES_DEFAULT_SCHEMA \
                -e SPRING_DATA_REDIS_URL=$SPRING_DATA_REDIS_URL \
                -e SPRING_DATA_REDIS_HOST=$SPRING_DATA_REDIS_HOST \
                -e SPRING_DATA_REDIS_PORT=$SPRING_DATA_REDIS_PORT \
                -e SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD \
                baedalsodae:latest && \
              rm -f baedalsodae.tar.gz mock-pg.tar.gz && \
              docker image prune -f && \
              docker ps"
        env:
          API_SERVER_PORT: ${{ secrets.API_SERVER_PORT }}
          ENCRYPTION_AES_KEY: ${{ secrets.ENCRYPTION_AES_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DEFAULT_SCHEMA: ${{ secrets.POSTGRES_DEFAULT_SCHEMA }}
          SPRING_DATA_REDIS_URL: ${{ secrets.SPRING_DATA_REDIS_URL }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/baedalsodae}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${POSTGRES_DEFAULT_SCHEMA:public}
        format_sql: false
        jdbc.time_zone: Asia/Seoul
  sql:
    init:
      mode: never

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-openai-key}
      chat:
        options:
          model: gpt-4o-mini
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: false
      repositories:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

JWT_SECRET: ${JWT_SECRET:dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHk=}
JWT_EXPIRATION: ${JWT_EXPIRATION:3600000}
JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:604800000}

encryption:
  aes:
    key: ${ENCRYPTION_AES_KEY:0123456789abcdef0123456789abcdef}

pg:
  url: http://localhost:8089

logging:
  level:
    org.springframework.boot.diagnostics: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
    org.apache.catalina: DEBUG

server:
  port: ${API_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
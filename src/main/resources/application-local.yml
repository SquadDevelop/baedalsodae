spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${POSTGRES_DEFAULT_SCHEMA}
        format_sql: true
        jdbc.time_zone: Asia/Seoul
  sql:
    init:
      mode: never
  data:
    redis:
      url: ${REDIS_URL}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

JWT_SECRET: test-secret-key
JWT_EXPIRATION: 100000

encryption:
  aes:
    key: ${ENCRYPTION_AES_KEY}

pg:
  url: http://localhost:8089

logging:
  level:
    org.springframework.boot.diagnostics: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
    org.apache.catalina: DEBUG

server:
  port: ${API_SERVER_PORT}
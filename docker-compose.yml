services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baedalsodae-app
    ports:
      - "${API_SERVER_PORT}:${API_SERVER_PORT}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://baedalsodae-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ENCRYPTION_AES_KEY: ${ENCRYPTION_AES_KEY}
      SPRING_PROFILES_ACTIVE: local
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs  # Optional: for persistent logs
    depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_healthy

  postgres:
    image: postgres:17
    container_name: baedalsodae-postgres
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./script:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: baedalsodae-redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-pg:
    build:
      context: ./mock-pg
      dockerfile: Dockerfile
    container_name: baedalsodae-mock-pg
    ports:
      - "8089:8080"

volumes:
  pgdata:
  redisdata:
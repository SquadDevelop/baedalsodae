services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baedalsodae-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://baedalsodae-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - ./logs:/app/logs  # Optional: for persistent logs
    depends_on:
       postgres:
         condition: service_healthy

  postgres:
    image: postgres:17
    container_name: baedalsodae-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d baedalsodae" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-pg:
    build:
      context: ./mock-pg
      dockerfile: Dockerfile
    container_name: baedalsodae-mock-pg
    ports:
      - "8089:8080"

volumes:
  pgdata:
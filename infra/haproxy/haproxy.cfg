global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option  forwardfor
    option  http-server-close

frontend http_front
    bind *:80
    default_backend api_servers

    # Health check endpoint for HAProxy itself
    acl is_health path /health
    use_backend health_backend if is_health

backend api_servers
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200

    server api-1 10.0.1.187:8080 check inter 5s fall 3 rise 2
    server api-2 10.0.1.179:8080 check inter 5s fall 3 rise 2

backend health_backend
    http-request return status 200 content-type text/plain string "OK"
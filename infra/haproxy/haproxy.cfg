global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:80

    acl is_health path /health
    use_backend health_backend if is_health

    default_backend api_servers

backend health_backend
    http-request return status 200 content-type "text/plain" string "OK"

backend api_servers
    balance roundrobin

    option httpchk GET /api/v1/actuator/health
    http-check expect status 200

    default-server inter 5s fall 3 rise 2

    server api-1 10.0.1.187:8080 check
    server api-2 10.0.1.179:8080 check

listen status
    bind *:8084
    stats enable
    stats uri /stats
    stats refresh 10s
    stats hide-version
